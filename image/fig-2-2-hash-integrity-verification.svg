<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="哈希完整性校验原理图">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box-title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", "SimHei", Arial, sans-serif; }
      .box-body { font: 500 25px "Microsoft YaHei", "Noto Sans CJK SC", "SimHei", Arial, sans-serif; fill: #42526b; }
      .hash-text { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", "SimHei", Arial, sans-serif; }
      .small { font: 600 24px "Microsoft YaHei", "Noto Sans CJK SC", "SimHei", Arial, sans-serif; }
      .callout-text { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", "SimHei", Arial, sans-serif; fill: #243447; }
      .tiny { font: 500 21px "Microsoft YaHei", "Noto Sans CJK SC", "SimHei", Arial, sans-serif; fill: #5b6472; }
      .blue-fill { fill: #eff7ff; }
      .blue-stroke { stroke: #2f80ed; }
      .blue-text { fill: #1f6fd1; }
      .orange-fill { fill: #fff3e6; }
      .orange-stroke { stroke: #f2994a; }
      .orange-text { fill: #d46a1f; }
      .red-text { fill: #d64545; }
      .panel-fill { fill: #fbfdff; }
      .muted-stroke { stroke: #d7dee8; }
      .shadow { filter: url(#softShadow); }
      .arrow { fill: none; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#9aa6b2" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#2f80ed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#f2994a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#8792a2"/>
    </marker>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <rect x="70" y="70" width="1780" height="940" rx="18" fill="#ffffff" stroke="#e7edf5" stroke-width="2"/>

  <g transform="translate(168 116)">
    <rect x="0" y="0" width="182" height="52" rx="26" fill="#edf6ff" stroke="#b8dcff" stroke-width="2"/>
    <text x="91" y="35" text-anchor="middle" class="small blue-text">单向性</text>
  </g>
  <g transform="translate(392 116)">
    <rect x="0" y="0" width="252" height="52" rx="26" fill="#f7fbff" stroke="#d7dee8" stroke-width="2"/>
    <text x="126" y="35" text-anchor="middle" class="small" fill="#42526b">固定长度摘要</text>
  </g>
  <g transform="translate(686 116)">
    <rect x="0" y="0" width="202" height="52" rx="26" fill="#fff5ea" stroke="#ffd1a3" stroke-width="2"/>
    <text x="101" y="35" text-anchor="middle" class="small orange-text">雪崩效应</text>
  </g>

  <g id="top-flow" transform="translate(135 270)">
    <rect class="blue-fill blue-stroke shadow" x="0" y="0" width="330" height="178" rx="12" stroke-width="3"/>
    <rect x="0" y="0" width="330" height="58" rx="12" fill="#dff0ff"/>
    <path d="M 0 46 Q 0 58 12 58 H 318 Q 330 58 330 46 V 58 H 0 Z" fill="#dff0ff"/>
    <text x="165" y="39" text-anchor="middle" class="box-title blue-text">原始日志内容</text>
    <text x="45" y="92" class="box-body">时间：10:00</text>
    <text x="45" y="126" class="box-body">操作：用户登录</text>
    <text x="45" y="160" class="box-body">状态：成功</text>

    <path class="arrow blue-stroke" d="M 358 89 H 478" marker-end="url(#arrowBlue)"/>

    <rect class="blue-fill blue-stroke shadow" x="510" y="0" width="330" height="178" rx="12" stroke-width="3"/>
    <circle cx="585" cy="89" r="34" fill="#dff0ff" stroke="#b8dcff" stroke-width="2"/>
    <path d="M 564 89 H 606 M 585 68 V 110 M 571 75 L 599 103 M 599 75 L 571 103" stroke="#2f80ed" stroke-width="5" stroke-linecap="round"/>
    <text x="695" y="83" text-anchor="middle" class="box-title blue-text">SHA-256</text>
    <text x="695" y="125" text-anchor="middle" class="box-title blue-text">哈希计算</text>

    <path class="arrow blue-stroke" d="M 868 89 H 988" marker-end="url(#arrowBlue)"/>

    <rect class="blue-fill blue-stroke shadow" x="1020" y="0" width="330" height="178" rx="12" stroke-width="3"/>
    <text x="1185" y="58" text-anchor="middle" class="box-title blue-text">哈希摘要 A</text>
    <text x="1185" y="106" text-anchor="middle" class="hash-text blue-text">A = 8f3a...c21e</text>
    <text x="1185" y="145" text-anchor="middle" class="tiny">256 位固定摘要</text>
  </g>

  <g id="bottom-flow" transform="translate(135 594)">
    <rect class="orange-fill orange-stroke shadow" x="0" y="0" width="330" height="178" rx="12" stroke-width="3"/>
    <rect x="0" y="0" width="330" height="58" rx="12" fill="#ffe5cc"/>
    <path d="M 0 46 Q 0 58 12 58 H 318 Q 330 58 330 46 V 58 H 0 Z" fill="#ffe5cc"/>
    <text x="165" y="39" text-anchor="middle" class="box-title orange-text">修改后日志内容</text>
    <text x="45" y="92" class="box-body">时间：10:00</text>
    <text x="45" y="126" class="box-body">操作：用户登录</text>
    <text x="45" y="160" class="box-body red-text">状态：失败</text>

    <path class="arrow orange-stroke" d="M 358 89 H 478" marker-end="url(#arrowOrange)"/>

    <rect class="orange-fill orange-stroke shadow" x="510" y="0" width="330" height="178" rx="12" stroke-width="3"/>
    <circle cx="585" cy="89" r="34" fill="#ffe5cc" stroke="#ffd1a3" stroke-width="2"/>
    <path d="M 564 89 H 606 M 585 68 V 110 M 571 75 L 599 103 M 599 75 L 571 103" stroke="#f2994a" stroke-width="5" stroke-linecap="round"/>
    <text x="695" y="83" text-anchor="middle" class="box-title orange-text">SHA-256</text>
    <text x="695" y="125" text-anchor="middle" class="box-title orange-text">哈希计算</text>

    <path class="arrow orange-stroke" d="M 868 89 H 988" marker-end="url(#arrowOrange)"/>

    <rect class="orange-fill orange-stroke shadow" x="1020" y="0" width="330" height="178" rx="12" stroke-width="3"/>
    <text x="1185" y="58" text-anchor="middle" class="box-title orange-text">哈希摘要 B</text>
    <text x="1185" y="106" text-anchor="middle" class="hash-text orange-text">B = d7e4...51a0</text>
    <text x="1185" y="145" text-anchor="middle" class="tiny">细微变化产生新摘要</text>
  </g>

  <g id="compare" transform="translate(1570 320)">
    <path class="thin" d="M -85 39 H -10" stroke="#8792a2" marker-end="url(#arrowGray)"/>
    <path class="thin" d="M -85 339 H -10" stroke="#8792a2" marker-end="url(#arrowGray)"/>
    <rect class="panel-fill muted-stroke shadow" x="0" y="0" width="270" height="428" rx="14" stroke-width="2.5"/>
    <text x="135" y="82" text-anchor="middle" class="small blue-text">哈希摘要 A</text>
    <line x1="54" y1="108" x2="216" y2="108" stroke="#cbd8e6" stroke-width="2"/>
    <text x="135" y="192" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, Arial, sans-serif" font-size="76" font-weight="800" fill="#d64545">≠</text>
    <line x1="54" y1="235" x2="216" y2="235" stroke="#cbd8e6" stroke-width="2"/>
    <text x="135" y="300" text-anchor="middle" class="small orange-text">哈希摘要 B</text>
    <rect x="30" y="336" width="210" height="56" rx="28" fill="#fff0f0" stroke="#ffc4c4" stroke-width="2"/>
    <text x="135" y="372" text-anchor="middle" class="small red-text">A 不等于 B</text>
  </g>

  <g transform="translate(1308 832)">
    <rect x="0" y="0" width="492" height="78" rx="12" fill="#f7fbff" stroke="#d7e6f8" stroke-width="2"/>
    <rect x="26" y="14" width="58" height="50" rx="10" fill="#edf6ff" stroke="#c7e3ff" stroke-width="2"/>
    <path d="M 41 39 L 55 53 L 77 25" fill="none" stroke="#2f80ed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="300" y="50" text-anchor="middle" class="callout-text">日志内容变化可被检测</text>
  </g>

  <path d="M 410 785 C 560 875, 840 875, 990 785" fill="none" stroke="#e7edf5" stroke-width="3" stroke-dasharray="12 12"/>
  <text x="700" y="866" text-anchor="middle" class="tiny">同一算法处理不同内容，输出摘要不同</text>
</svg>
