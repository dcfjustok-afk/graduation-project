<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>可信日志审计闭环流程</title>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0891B2"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#EA580C"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <filter id="card-shadow" x="-6%" y="-10%" width="112%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.09"/>
    </filter>
    <style>
      text {
        font-family: "Microsoft YaHei", "SimSun", "Noto Sans CJK SC", Arial, sans-serif;
        fill: #1E293B;
      }
      .lane-title {
        font-size: 18px;
        font-weight: 700;
        fill: #334155;
      }
      .node-title {
        font-size: 19px;
        font-weight: 700;
      }
      .node-title-small {
        font-size: 18px;
        font-weight: 700;
      }
      .desc {
        font-size: 15px;
        fill: #334155;
      }
      .desc-small {
        font-size: 14px;
        fill: #334155;
      }
      .code {
        font-family: Consolas, "Microsoft YaHei", monospace;
        font-size: 14px;
        fill: #334155;
      }
      .badge-text {
        font-size: 14px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .arrow-label {
        font-size: 14px;
        font-weight: 600;
        fill: #475569;
      }
      .note {
        font-size: 15px;
        font-weight: 600;
        fill: #334155;
      }
      .pill-text {
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <rect x="32" y="32" width="1536" height="365" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text class="lane-title" x="56" y="63">采集、链下存储与链上存证</text>

  <rect x="32" y="424" width="1536" height="396" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text class="lane-title" x="56" y="455">审计比对、告警与前端展示</text>

  <!-- 1. 日志文件 -->
  <g id="log-files" filter="url(#card-shadow)">
    <rect x="54" y="102" width="210" height="158" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="81" cy="129" r="16" fill="#2563EB"/>
    <text class="badge-text" x="81" y="134" text-anchor="middle">1</text>
    <text class="node-title" x="109" y="135">日志文件</text>
    <line x1="74" y1="156" x2="244" y2="156" stroke="#BFDBFE" stroke-width="1.5"/>
    <path d="M82 181 H112 L124 193 V228 H82 Z" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/>
    <path d="M112 181 V193 H124" fill="none" stroke="#60A5FA" stroke-width="1.6"/>
    <text class="desc" x="137" y="188">任务运行日志</text>
    <text class="desc" x="137" y="213">错误日志</text>
    <text class="desc" x="137" y="238">业务日志</text>
  </g>

  <!-- 2. Agent 增量采集 -->
  <g id="agent-collector" filter="url(#card-shadow)">
    <rect x="298" y="102" width="210" height="158" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="325" cy="129" r="16" fill="#2563EB"/>
    <text class="badge-text" x="325" y="134" text-anchor="middle">2</text>
    <text class="node-title" x="353" y="135">Agent 增量采集</text>
    <line x1="318" y1="156" x2="488" y2="156" stroke="#BFDBFE" stroke-width="1.5"/>
    <text class="desc" x="323" y="187">读取新增内容</text>
    <text class="code" x="323" y="214">维护 last_offset</text>
    <text class="code" x="323" y="241">封装 taskId</text>
  </g>

  <!-- 3. Server 接收 -->
  <g id="server-receive" filter="url(#card-shadow)">
    <rect x="542" y="102" width="210" height="158" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="569" cy="129" r="16" fill="#2563EB"/>
    <text class="badge-text" x="569" y="134" text-anchor="middle">3</text>
    <text class="node-title" x="597" y="135">Server 接收</text>
    <line x1="562" y1="156" x2="732" y2="156" stroke="#BFDBFE" stroke-width="1.5"/>
    <text class="code" x="567" y="187">POST /api/logs</text>
    <text class="desc" x="567" y="214">参数校验</text>
    <text class="desc" x="567" y="241">业务编排</text>
  </g>

  <!-- 4. SQLite 入库 -->
  <g id="sqlite-store" filter="url(#card-shadow)">
    <rect x="786" y="102" width="210" height="158" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
    <circle cx="813" cy="129" r="16" fill="#0891B2"/>
    <text class="badge-text" x="813" y="134" text-anchor="middle">4</text>
    <text class="node-title" x="841" y="135">SQLite 入库</text>
    <line x1="806" y1="156" x2="976" y2="156" stroke="#A5F3FC" stroke-width="1.5"/>
    <path d="M817 182 C817 173 862 173 862 182 V225 C862 234 817 234 817 225 Z" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.6"/>
    <ellipse cx="839.5" cy="182" rx="22.5" ry="8.5" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.6"/>
    <text class="desc" x="880" y="190">写入 logs 表</text>
    <text class="desc" x="880" y="218">保存日志原文</text>
  </g>

  <!-- 5. SHA-256 哈希计算 -->
  <g id="sha256-hash" filter="url(#card-shadow)">
    <rect x="1030" y="102" width="230" height="158" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <circle cx="1057" cy="129" r="16" fill="#EA580C"/>
    <text class="badge-text" x="1057" y="134" text-anchor="middle">5</text>
    <text class="node-title-small" x="1085" y="125">SHA-256</text>
    <text class="node-title-small" x="1085" y="149">哈希计算</text>
    <line x1="1050" y1="168" x2="1240" y2="168" stroke="#FED7AA" stroke-width="1.5"/>
    <text class="code" x="1070" y="204">log_content</text>
    <path d="M1120 224 H1184" stroke="#EA580C" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
    <text class="code" x="1170" y="248">logHash</text>
  </g>

  <!-- 6. LogRegistry 上链存证 -->
  <g id="logregistry-chain" filter="url(#card-shadow)">
    <rect x="1294" y="102" width="252" height="158" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <circle cx="1321" cy="129" r="16" fill="#16A34A"/>
    <text class="badge-text" x="1321" y="134" text-anchor="middle">6</text>
    <text class="node-title-small" x="1349" y="125">LogRegistry</text>
    <text class="node-title-small" x="1349" y="149">上链存证</text>
    <line x1="1314" y1="168" x2="1526" y2="168" stroke="#BBF7D0" stroke-width="1.5"/>
    <text class="code" x="1322" y="199">storeLog(taskId, logHash)</text>
    <text class="desc" x="1322" y="226">记录 transaction_hash</text>
    <text class="desc-small" x="1322" y="252">链上保存哈希存证</text>
  </g>

  <!-- Top-row flow arrows -->
  <path d="M264 181 H298" stroke="#2563EB" stroke-width="2.6" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M508 181 H542" stroke="#2563EB" stroke-width="2.6" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M752 181 H786" stroke="#2563EB" stroke-width="2.6" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M996 181 H1030" stroke="#0891B2" stroke-width="2.6" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M1260 181 H1294" stroke="#16A34A" stroke-width="2.6" fill="none" marker-end="url(#arrow-green)"/>
  <text class="arrow-label" x="1277" y="286" text-anchor="middle" fill="#16A34A">仅 logHash 上链</text>

  <g id="offchain-onchain-note">
    <rect x="786" y="300" width="760" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text class="note" x="1166" y="325" text-anchor="middle">SQLite 保存日志原文；链上仅保存 taskId 与 logHash</text>
    <text class="note" x="1166" y="348" text-anchor="middle">transaction_hash 回写链下记录</text>
  </g>

  <!-- Transition from evidence storage to audit stage -->
  <path d="M1546 181 H1558 V382 H340 V492 H195 V510" stroke="#EA580C" stroke-width="2.8" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="680" y="365" width="240" height="26" rx="13" fill="#F8FAFC"/>
  <text class="arrow-label" x="800" y="383" text-anchor="middle" fill="#EA580C">定时任务或人工操作触发审计</text>

  <!-- 7. 审计任务触发 -->
  <g id="audit-trigger" filter="url(#card-shadow)">
    <rect x="80" y="510" width="230" height="160" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <circle cx="107" cy="537" r="16" fill="#EA580C"/>
    <text class="badge-text" x="107" y="542" text-anchor="middle">7</text>
    <text class="node-title" x="135" y="543">审计任务触发</text>
    <line x1="100" y1="561" x2="290" y2="561" stroke="#FED7AA" stroke-width="1.5"/>
    <text class="desc" x="111" y="593">读取日志原文</text>
    <text class="desc" x="111" y="620">重新计算</text>
    <text class="code" x="111" y="646">actualHash</text>
  </g>

  <!-- 8. 三方哈希比对 -->
  <g id="hash-compare" filter="url(#card-shadow)">
    <rect x="385" y="510" width="230" height="160" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <circle cx="412" cy="537" r="16" fill="#EA580C"/>
    <text class="badge-text" x="412" y="542" text-anchor="middle">8</text>
    <text class="node-title" x="440" y="543">三方哈希比对</text>
    <line x1="405" y1="561" x2="595" y2="561" stroke="#FED7AA" stroke-width="1.5"/>
    <text class="code" x="418" y="593">expectedHash</text>
    <text class="code" x="418" y="620">actualHash</text>
    <text class="code" x="418" y="647">onChainHash</text>
  </g>

  <!-- 9. 审计状态判定 -->
  <g id="audit-status" filter="url(#card-shadow)">
    <rect x="690" y="500" width="270" height="180" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <circle cx="717" cy="527" r="16" fill="#EA580C"/>
    <text class="badge-text" x="717" y="532" text-anchor="middle">9</text>
    <text class="node-title" x="745" y="533">审计状态判定</text>
    <line x1="710" y1="551" x2="940" y2="551" stroke="#FED7AA" stroke-width="1.5"/>
    <rect x="714" y="570" width="222" height="27" rx="13.5" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.4"/>
    <text class="pill-text" x="825" y="589" text-anchor="middle" fill="#15803D">passed：三方一致</text>
    <rect x="714" y="608" width="222" height="27" rx="13.5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
    <text class="pill-text" x="825" y="627" text-anchor="middle" fill="#B91C1C">failed：哈希不一致</text>
    <rect x="714" y="646" width="222" height="27" rx="13.5" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
    <text class="pill-text" x="825" y="665" text-anchor="middle" fill="#475569">pending：链上记录缺失或不可用</text>
  </g>

  <!-- 10. 异常告警 -->
  <g id="alert" filter="url(#card-shadow)">
    <rect x="1035" y="510" width="220" height="160" rx="10" fill="#FFF1F2" stroke="#DC2626" stroke-width="2"/>
    <circle cx="1062" cy="537" r="16" fill="#DC2626"/>
    <text class="badge-text" x="1062" y="542" text-anchor="middle">10</text>
    <text class="node-title" x="1090" y="543">异常告警</text>
    <line x1="1055" y1="561" x2="1235" y2="561" stroke="#FECDD3" stroke-width="1.5"/>
    <path d="M1088 602 L1113 651 H1063 Z" fill="#FFFFFF" stroke="#FB7185" stroke-width="1.8"/>
    <text class="desc" x="1130" y="594">failed</text>
    <text class="code" x="1130" y="620">hash_mismatch</text>
    <text class="desc" x="1130" y="646">alerts 表</text>
  </g>

  <!-- 11. Web 前端展示 -->
  <g id="web-frontend" filter="url(#card-shadow)">
    <rect x="1320" y="510" width="225" height="160" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
    <circle cx="1347" cy="537" r="16" fill="#475569"/>
    <text class="badge-text" x="1347" y="542" text-anchor="middle">11</text>
    <text class="node-title" x="1375" y="543">Web 前端展示</text>
    <line x1="1340" y1="561" x2="1525" y2="561" stroke="#CBD5E1" stroke-width="1.5"/>
    <text class="desc" x="1350" y="592">日志列表</text>
    <text class="desc" x="1350" y="618">审计记录、告警结果</text>
    <text class="desc" x="1350" y="644">统计图</text>
  </g>

  <!-- Audit stage flow arrows -->
  <path d="M310 590 H385" stroke="#EA580C" stroke-width="2.8" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M615 590 H690" stroke="#EA580C" stroke-width="2.8" fill="none" marker-end="url(#arrow-orange)"/>

  <!-- Status branches -->
  <path d="M960 536 C1088 468 1212 468 1320 536" stroke="#16A34A" stroke-width="2.6" fill="none" marker-end="url(#arrow-green)"/>
  <text class="arrow-label" x="1155" y="478" text-anchor="middle" fill="#15803D">passed</text>

  <path d="M960 620 H1035" stroke="#DC2626" stroke-width="2.8" fill="none" marker-end="url(#arrow-red)"/>
  <text class="arrow-label" x="998" y="609" text-anchor="middle" fill="#DC2626">failed</text>

  <path d="M960 660 C1085 718 1215 718 1320 656" stroke="#64748B" stroke-width="2.4" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow-gray)"/>
  <text class="arrow-label" x="1150" y="716" text-anchor="middle" fill="#475569">pending</text>

  <path d="M1255 590 H1320" stroke="#DC2626" stroke-width="2.8" fill="none" marker-end="url(#arrow-red)"/>

  <!-- Closed-loop arrow from Web display back to audit trigger -->
  <path d="M1432 670 V800 H195 V670" stroke="#475569" stroke-width="2.8" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="622" y="776" width="356" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text class="arrow-label" x="800" y="798" text-anchor="middle" fill="#334155">用户查看与复核后，可重新触发审计任务</text>

  <!-- Small legend -->
  <g id="legend">
    <rect x="55" y="846" width="1490" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="104" cy="863" r="6" fill="#2563EB"/>
    <text class="desc-small" x="118" y="868">日志采集</text>
    <circle cx="236" cy="863" r="6" fill="#0891B2"/>
    <text class="desc-small" x="250" y="868">链下数据库</text>
    <circle cx="390" cy="863" r="6" fill="#16A34A"/>
    <text class="desc-small" x="404" y="868">链上合约</text>
    <circle cx="532" cy="863" r="6" fill="#EA580C"/>
    <text class="desc-small" x="546" y="868">审计比对</text>
    <circle cx="674" cy="863" r="6" fill="#DC2626"/>
    <text class="desc-small" x="688" y="868">异常告警</text>
    <text class="desc-small" x="1492" y="868" text-anchor="end">链上存证只包含哈希摘要，不直接保存日志原文</text>
  </g>
</svg>
